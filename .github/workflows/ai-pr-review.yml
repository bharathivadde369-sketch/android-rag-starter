name: Android AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install openai requests

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          
          # Check if a merge base exists
          if git merge-base origin/${{ github.base_ref }} HEAD > /dev/null 2>&1; then
               git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          else
          # No common ancestor — fall back to diffing just the HEAD commit
              echo "⚠️ No merge base found, falling back to HEAD diff"
              git diff HEAD~1..HEAD > pr_diff.txt 2>/dev/null || git show HEAD > pr_diff.txt
          fi
          echo "Diff size: $(wc -l < pr_diff.txt) lines"

      - name: Run AI Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -s pr_diff.txt ]; then
            echo "No diff found, skipping AI review."
            exit 0
          fi
          python .github/scripts/ai_review.py
